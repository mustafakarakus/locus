[workspace]
resolver = "2"
members = [
    "crates/locus-core",
    "crates/locus-cli",
    "crates/locusd",
    "crates/locus-mcp",
    "crates/locus-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/locus/locus"

[workspace.dependencies]
locus-core = { path = "crates/locus-core" }
locus-mcp = { path = "crates/locus-mcp" }
locus-testkit = { path = "crates/locus-testkit" }

anyhow = "1"
thiserror = "1"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "fast-rng"] }
time = { version = "0.3", features = ["std", "formatting"] }
tempfile = "3"
criterion = "0.5"
clap = { version = "4", features = ["derive", "cargo"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
interprocess = "2"
ctrlc = { version = "3", features = ["termination"] }
regex = "1"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
